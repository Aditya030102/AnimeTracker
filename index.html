<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch Log — Anime Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1b1f2b;
    --ink-soft:#242a39;
    --paper:#efe8d8;
    --paper-dim:#e2dac5;
    --rust:#c0572f;
    --moss:#59795c;
    --gold:#d9a441;
    --line: rgba(239,232,216,0.14);
    --text-dim: rgba(239,232,216,0.55);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  ::selection{ background:var(--rust); color:var(--paper); }

  a{ color:inherit; }

  /* ---------- header ---------- */
  header{
    padding:2.4rem 1.6rem 1.2rem;
    max-width:920px;
    margin:0 auto;
  }
  .masthead{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:1rem;
    border-bottom:1px solid var(--line);
    padding-bottom:1.1rem;
  }
  h1{
    font-family:'Fraunces',serif;
    font-optical-sizing:auto;
    font-weight:600;
    font-size:2.1rem;
    margin:0;
    letter-spacing:-0.01em;
  }
  h1 span{ color:var(--rust); }
  .tagline{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.72rem;
    color:var(--text-dim);
    margin-top:0.35rem;
  }
  .counts{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.72rem;
    color:var(--text-dim);
    text-align:right;
    line-height:1.6;
  }

  /* ---------- search ---------- */
  .search-wrap{
    max-width:920px;
    margin:1.6rem auto 0;
    padding:0 1.6rem;
    position:relative;
  }
  .search-box{
    display:flex;
    align-items:center;
    background:var(--paper);
    border-radius:3px;
    padding:0.15rem;
  }
  .search-box input{
    flex:1;
    border:none;
    background:transparent;
    font-family:'Inter',sans-serif;
    font-size:1rem;
    padding:0.85rem 1rem;
    color:var(--ink);
    outline:none;
  }
  .search-box input::placeholder{ color:#8a8370; }
  .search-icon{
    padding:0 0.9rem;
    color:#8a8370;
    font-size:0.95rem;
  }
  .results{
    position:absolute;
    left:1.6rem; right:1.6rem;
    top:calc(100% + 0.4rem);
    background:var(--paper);
    border-radius:3px;
    max-height:420px;
    overflow-y:auto;
    box-shadow:0 18px 40px rgba(0,0,0,0.45);
    z-index:20;
    display:none;
  }
  .results.open{ display:block; }
  .result-row{
    display:flex;
    align-items:center;
    gap:0.9rem;
    padding:0.6rem 0.9rem;
    border-bottom:1px solid rgba(27,31,43,0.08);
    color:var(--ink);
  }
  .result-row:last-child{ border-bottom:none; }
  .result-row img{
    width:38px; height:52px;
    object-fit:cover;
    border-radius:2px;
    flex-shrink:0;
    background:#ccc;
  }
  .result-meta{ flex:1; min-width:0; }
  .result-title{
    font-size:0.9rem;
    font-weight:500;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .result-year{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.68rem;
    color:#8a8370;
    margin-top:0.15rem;
  }
  .add-buttons{ display:flex; gap:0.35rem; flex-shrink:0; }
  .add-btn{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.62rem;
    letter-spacing:0.02em;
    padding:0.32rem 0.5rem;
    border-radius:2px;
    border:1px solid transparent;
    cursor:pointer;
    background:none;
    color:var(--ink);
    opacity:0.55;
    transition:opacity 0.15s, background 0.15s;
  }
  .add-btn:hover{ opacity:1; background:rgba(27,31,43,0.08); }
  .add-btn.added{ opacity:1; background:var(--moss); color:var(--paper); }
  .search-status{
    padding:0.9rem;
    font-size:0.85rem;
    color:#8a8370;
    font-family:'IBM Plex Mono',monospace;
  }

  /* ---------- tabs ---------- */
  .tabs{
    max-width:920px;
    margin:2.2rem auto 0;
    padding:0 1.6rem;
    display:flex;
    gap:0.4rem;
  }
  .tab{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.74rem;
    letter-spacing:0.02em;
    padding:0.6rem 1rem 0.55rem;
    background:var(--ink-soft);
    border:none;
    border-bottom:2px solid transparent;
    color:var(--text-dim);
    cursor:pointer;
    border-radius:3px 3px 0 0;
    transition:color 0.15s, background 0.15s;
  }
  .tab:hover{ color:var(--paper); }
  .tab.active{
    color:var(--paper);
    background:var(--ink-soft);
    border-bottom:2px solid var(--rust);
  }
  .tab .n{ color:var(--text-dim); margin-left:0.3rem; }
  .tab.active .n{ color:var(--gold); }

  /* ---------- grid ---------- */
  main{
    max-width:920px;
    margin:0 auto;
    padding:1.6rem;
    min-height:40vh;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(140px,1fr));
    gap:1.1rem;
  }
  .card{
    background:var(--ink-soft);
    border-radius:3px;
    overflow:hidden;
    position:relative;
    border:1px solid var(--line);
  }
  .card img{
    width:100%;
    aspect-ratio:2/3;
    object-fit:cover;
    display:block;
    background:#333;
  }
  .card-body{ padding:0.6rem 0.65rem 0.7rem; }
  .card-title{
    font-size:0.82rem;
    font-weight:500;
    line-height:1.3;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .card-actions{
    display:flex;
    gap:0.3rem;
    margin-top:0.5rem;
    flex-wrap:wrap;
  }
  .mini-btn{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.6rem;
    padding:0.24rem 0.4rem;
    border-radius:2px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--text-dim);
    cursor:pointer;
  }
  .mini-btn:hover{ color:var(--paper); border-color:var(--paper); }
  .mini-btn.remove:hover{ color:var(--rust); border-color:var(--rust); }

  .empty{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.82rem;
    color:var(--text-dim);
    padding:2.5rem 0.5rem;
    text-align:center;
    border:1px dashed var(--line);
    border-radius:3px;
  }

  footer{
    max-width:920px;
    margin:2rem auto 3rem;
    padding:1rem 1.6rem 0;
    border-top:1px solid var(--line);
    font-family:'IBM Plex Mono',monospace;
    font-size:0.65rem;
    color:var(--text-dim);
  }

  @media (max-width:520px){
    .masthead{ flex-direction:column; align-items:flex-start; gap:0.5rem;}
    .counts{ text-align:left; }
  }
</style>
</head>
<body>

<header>
  <div class="masthead">
    <div>
      <h1>Watch <span>Log</span></h1>
      <div class="tagline">a private record of what you've seen</div>
    </div>
    <div class="counts" id="counts"></div>
  </div>
</header>

<div class="search-wrap">
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search for an anime by title…" autocomplete="off">
    <div class="search-icon">⌕</div>
  </div>
  <div class="results" id="results"></div>
</div>

<nav class="tabs" id="tabs">
  <button class="tab active" data-list="watching">Watching <span class="n" id="n-watching"></span></button>
  <button class="tab" data-list="finished">Finished <span class="n" id="n-finished"></span></button>
  <button class="tab" data-list="later">Watch Later <span class="n" id="n-later"></span></button>
</nav>

<main>
  <div class="grid" id="grid"></div>
</main>

<footer>
  data is stored only in this browser · nothing is sent anywhere except anime searches
</footer>

<script>
const LISTS = ['watching','finished','later'];
const LABELS = { watching:'Watching', finished:'Finished', later:'Watch Later' };
let activeList = 'watching';

function loadList(name){
  try{
    return JSON.parse(localStorage.getItem('watchlog:'+name)) || [];
  }catch(e){ return []; }
}
function saveList(name, arr){
  localStorage.setItem('watchlog:'+name, JSON.stringify(arr));
}

function isInList(name, id){
  return loadList(name).some(item => item.mal_id === id);
}

function addTo(name, anime){
  const list = loadList(name);
  if(list.some(i => i.mal_id === anime.mal_id)) return;
  list.unshift(anime);
  saveList(name, list);
  renderCounts();
  if(activeList === name) renderGrid();
}

function removeFrom(name, id){
  const list = loadList(name).filter(i => i.mal_id !== id);
  saveList(name, list);
  renderCounts();
  renderGrid();
}

function moveTo(fromName, toName, anime){
  removeFrom(fromName, anime.mal_id);
  addTo(toName, anime);
}

function renderCounts(){
  LISTS.forEach(name => {
    document.getElementById('n-'+name).textContent = loadList(name).length || '';
  });
}

function renderGrid(){
  const grid = document.getElementById('grid');
  const list = loadList(activeList);
  grid.innerHTML = '';
  if(list.length === 0){
    const emptyMsgs = {
      watching: 'Nothing in progress yet. Search above and add something.',
      finished: 'Nothing marked finished yet.',
      later: 'Your watch-later shelf is empty.'
    };
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1">${emptyMsgs[activeList]}</div>`;
    return;
  }
  list.forEach(anime => {
    const card = document.createElement('div');
    card.className = 'card';
    const otherLists = LISTS.filter(l => l !== activeList);
    card.innerHTML = `
      <img src="${anime.image}" alt="${escapeHtml(anime.title)}" loading="lazy">
      <div class="card-body">
        <div class="card-title">${escapeHtml(anime.title)}</div>
        <div class="card-actions">
          ${otherLists.map(l => `<button class="mini-btn" data-move="${l}">→ ${LABELS[l]}</button>`).join('')}
          <button class="mini-btn remove" data-remove="1">remove</button>
        </div>
      </div>
    `;
    card.querySelectorAll('[data-move]').forEach(btn => {
      btn.addEventListener('click', () => moveTo(activeList, btn.dataset.move, anime));
    });
    card.querySelector('[data-remove]').addEventListener('click', () => removeFrom(activeList, anime.mal_id));
    grid.appendChild(card);
  });
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

document.getElementById('tabs').addEventListener('click', e => {
  const btn = e.target.closest('.tab');
  if(!btn) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  activeList = btn.dataset.list;
  renderGrid();
});

/* ---------- search ---------- */
const searchInput = document.getElementById('searchInput');
const resultsBox = document.getElementById('results');
let searchTimer = null;

searchInput.addEventListener('input', () => {
  clearTimeout(searchTimer);
  const q = searchInput.value.trim();
  if(q.length < 2){
    resultsBox.classList.remove('open');
    resultsBox.innerHTML = '';
    return;
  }
  searchTimer = setTimeout(() => runSearch(q), 400);
});

document.addEventListener('click', (e) => {
  if(!e.target.closest('.search-wrap')){
    resultsBox.classList.remove('open');
  }
});

async function fetchWithRetry(url, options, attempts = 3){
  for(let i = 0; i < attempts; i++){
    let res;
    try{
      res = await fetch(url, options);
    }catch(networkErr){
      throw new Error('network: ' + networkErr.message);
    }
    if(res.status === 429){
      await new Promise(r => setTimeout(r, 900 * (i + 1)));
      continue;
    }
    if(!res.ok){
      throw new Error('http ' + res.status);
    }
    return res;
  }
  throw new Error('rate limited after retries');
}

const ANILIST_QUERY = `
query ($search: String) {
  Page(perPage: 8) {
    media(search: $search, type: ANIME, sort: SEARCH_MATCH) {
      id
      title { english romaji }
      seasonYear
      format
      coverImage { large }
    }
  }
}`;

async function runSearch(query){
  resultsBox.classList.add('open');
  resultsBox.innerHTML = `<div class="search-status">searching…</div>`;
  try{
    const res = await fetchWithRetry('https://graphql.anilist.co', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({ query: ANILIST_QUERY, variables: { search: query } })
    });
    const data = await res.json();
    const items = data?.data?.Page?.media || [];
    if(items.length === 0){
      resultsBox.innerHTML = `<div class="search-status">no matches found</div>`;
      return;
    }
    resultsBox.innerHTML = '';
    items.forEach(item => {
      const anime = {
        mal_id: item.id,
        title: item.title.english || item.title.romaji,
        image: item.coverImage?.large || ''
      };
      const row = document.createElement('div');
      row.className = 'result-row';
      row.innerHTML = `
        <img src="${anime.image}" alt="">
        <div class="result-meta">
          <div class="result-title">${escapeHtml(anime.title)}</div>
          <div class="result-year">${item.seasonYear || '—'} · ${(item.format || 'anime').toLowerCase()}</div>
        </div>
        <div class="add-buttons">
          ${LISTS.map(l => `<button class="add-btn" data-add="${l}">${LABELS[l].split(' ')[0]}</button>`).join('')}
        </div>
      `;
      row.querySelectorAll('[data-add]').forEach(btn => {
        const listName = btn.dataset.add;
        if(isInList(listName, anime.mal_id)) btn.classList.add('added');
        btn.addEventListener('click', () => {
          addTo(listName, anime);
          btn.classList.add('added');
        });
      });
      resultsBox.appendChild(row);
    });
  }catch(err){
    console.error('Watch Log search error:', err);
    let msg = 'search failed — try again in a moment';
    if(err.message.startsWith('network')){
      msg = 'search failed — couldn\'t reach the anime database. Check your internet connection, or an ad-blocker/extension may be blocking graphql.anilist.co.';
    }else if(err.message.includes('rate limited')){
      msg = 'search failed — the anime database is rate-limiting requests. Wait a few seconds and try again.';
    }else if(err.message.startsWith('http')){
      msg = 'search failed — the anime database returned an error (' + err.message.replace('http ', '') + ').';
    }
    resultsBox.innerHTML = `<div class="search-status">${msg}</div>`;
  }
}

renderCounts();
renderGrid();
</script>

</body>
</html>
